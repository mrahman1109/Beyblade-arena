<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beyblade Battle Arena</title>
<style>
  :root { --maxw: 720px; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#f6f7fb;
         display:grid; place-items:center; min-height:100vh; }
  .wrap { width:min(var(--maxw), 95vw); }
  h1 { font-size:clamp(18px, 3.5vw, 24px); margin:12px 0; text-align:center; }
  .hud { display:grid; gap:10px; grid-template-columns: 1fr auto 1fr; align-items:center; }
  .score { display:flex; gap:12px; justify-content:center; align-items:center; }
  .score .pill { padding:6px 10px; border-radius:999px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .controls { display:grid; gap:8px; grid-template-columns: 1fr; }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; background:#fff; padding:8px; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  label { font-size:14px; opacity:.9; }
  input[type="range"] { width:140px; }
  button { padding:8px 12px; border:1px solid #cfd3da; background:#fff; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .muted { opacity:.7; font-size:13px; }
  canvas { width:100%; height:auto; display:block; background:radial-gradient(circle at 50% 50%, #fff 0 55%, #f1f2f6 56% 100%); border-radius:16px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .footer { margin:10px 0 2px; text-align:center; font-size:12px; opacity:.65; }
  @media (min-width:680px){
    .controls { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🏟️ Beyblade Battle Arena</h1>

    <div class="hud">
      <div class="score">
        <span class="pill">🔵 P1: <b id="p1Score">0</b></span>
        <span class="pill">🔴 P2: <b id="p2Score">0</b></span>
        <span class="pill">🎯 First to <b id="targetWins">3</b></span>
      </div>
      <div><button id="resetAll">Reset</button></div>
      <div style="text-align:right">
        <label><input type="checkbox" id="botToggle" /> Bot controls P2</label>
      </div>
    </div>

    <canvas id="arena" width="720" height="720" aria-label="Beyblade Arena"></canvas>

    <div class="controls">
      <div class="row">
        <div><strong>🔵 Player 1</strong> <span class="muted">(Left)</span></div>
        <div>
          <label>Power <span id="p1PowerLbl">60</span></label>
          <input type="range" id="p1Power" min="20" max="100" value="60" />
          <button id="p1Launch">Launch P1</button>
        </div>
      </div>

      <div class="row">
        <div><strong>🔴 Player 2</strong> <span class="muted">(Right)</span></div>
        <div>
          <label>Power <span id="p2PowerLbl">60</span></label>
          <input type="range" id="p2Power" min="20" max="100" value="60" />
          <button id="p2Launch">Launch P2</button>
        </div>
      </div>

      <div class="row">
        <div><strong>Match Controls</strong></div>
        <div>
          <button id="rematch">Rematch</button>
          <button id="bestOf">Best of 5</button>
        </div>
      </div>
    </div>

    <div class="footer">Tip: Pick your power, then press Launch. Bumps drain energy. Ring-out or stop = you lose the round.</div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('arena');
  const ctx = canvas.getContext('2d');

  // UI elements
  const p1Power = document.getElementById('p1Power');
  const p2Power = document.getElementById('p2Power');
  const p1PowerLbl = document.getElementById('p1PowerLbl');
  const p2PowerLbl = document.getElementById('p2PowerLbl');
  const p1LaunchBtn = document.getElementById('p1Launch');
  const p2LaunchBtn = document.getElementById('p2Launch');
  const rematchBtn = document.getElementById('rematch');
  const resetAllBtn = document.getElementById('resetAll');
  const bestOfBtn = document.getElementById('bestOf');
  const botToggle = document.getElementById('botToggle');
  const p1ScoreEl = document.getElementById('p1Score');
  const p2ScoreEl = document.getElementById('p2Score');
  const targetWinsEl = document.getElementById('targetWins');

  // Arena setup
  const W = canvas.width, H = canvas.height;
  const center = { x: W/2, y: H/2 };
  const RING_RADIUS = Math.min(W,H)*0.44;    // inner playable ring
  const BEY_RADIUS = Math.min(W,H)*0.04;     // bigger beys for more contact
  const EDGE_OUT = RING_RADIUS + BEY_RADIUS*0.6; // ring-out threshold

  // Physics constants (tuned)
  const BASE_FRICTION = 0.0035;    // base drain per frame
  const WALL_BOUNCE = 0.92;        // speed kept after bounce
  const COLLISION_DAMP = 0.94;     // speed kept after a hit
  const CENTER_PULL = 0.006;       // gentle pull to center so they re-engage
  const JITTER = 0.015;            // tiny random wobble to avoid stale movement

  let raf = null;
  let roundOver = false;
  let targetWins = 3;
  let scores = { p1: 0, p2: 0 };
  const sparks = []; // collision particles

  class Bey {
    constructor(color, startX, startY){
      this.color = color;
      this.x = startX;
      this.y = startY;
      this.vx = 0;
      this.vy = 0;
      this.energy = 0;
      this.alive = true;
    }
    launch(power){
      const p = Math.max(20, Math.min(100, power));
      this.energy = p / 100;              // 0.2–1.0
      const speed = 3.2 * this.energy;    // initial speed

      // Aim roughly to center with a bit of angle variance
      let angle = Math.atan2(center.y - this.y, center.x - this.x);
      angle += (Math.random() - 0.5) * 0.45; // ± ~26°
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
    }
    update(){
      if (!this.alive) return;

      // Center pull (keeps tops circulating and colliding)
      const dxc = center.x - this.x, dyc = center.y - this.y;
      const distC = Math.hypot(dxc, dyc) || 1;
      this.vx += (dxc / distC) * CENTER_PULL * this.energy;
      this.vy += (dyc / distC) * CENTER_PULL * this.energy;

      // Small random jitter (prevents perfect parallel orbits)
      this.vx += (Math.random() - 0.5) * JITTER * this.energy;
      this.vy += (Math.random() - 0.5) * JITTER * this.energy;

      // Move
      this.x += this.vx;
      this.y += this.vy;

      // Wall bounce inside ring; small energy loss
      const d = Math.hypot(this.x - center.x, this.y - center.y);
      if (d > RING_RADIUS - BEY_RADIUS) {
        // normal
        const nx = (this.x - center.x) / d, ny = (this.y - center.y) / d;
        // reflect velocity along normal
        const vn = this.vx*nx + this.vy*ny;
        this.vx -= 2 * vn * nx;
        this.vy -= 2 * vn * ny;
        this.vx *= WALL_BOUNCE; this.vy *= WALL_BOUNCE;
        this.energy = Math.max(0, this.energy - 0.01);
        // nudge just inside wall
        const pushIn = (RING_RADIUS - BEY_RADIUS) - d - 0.5;
        this.x += -nx * (pushIn);
        this.y += -ny * (pushIn);
      }

      // Friction drains speed & energy
      const speed = Math.hypot(this.vx, this.vy);
      const drain = BASE_FRICTION + speed*0.002;
      this.energy = Math.max(0, this.energy - drain);
      if (speed > 0){
        const slow = Math.max(0, speed - drain*1.6);
        const k = slow / speed;
        this.vx *= k; this.vy *= k;
      }

      // Ring-out (beyond soft wall zone)
      if (d > EDGE_OUT) this.alive = false;
    }
    draw(){
      // body
      ctx.beginPath();
      ctx.arc(this.x, this.y, BEY_RADIUS, 0, Math.PI*2);
      ctx.fillStyle = this.color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(0,0,0,.15)";
      ctx.stroke();

      // energy arc
      ctx.beginPath();
      ctx.arc(this.x, this.y, BEY_RADIUS+5, -Math.PI/2, -Math.PI/2 + Math.PI*2*this.energy);
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 3;
      ctx.stroke();
    }
  }

  // Players (spawn closer so they meet fast)
  let p1 = new Bey("#2b7bff", center.x - RING_RADIUS*0.6, center.y);
  let p2 = new Bey("#ff3b3b", center.x + RING_RADIUS*0.6, center.y);

  // Helpers
  function dist(x1,y1,x2,y2){ return Math.hypot(x2-x1, y2-y1); }

  function resetRound(){
    roundOver = false;
    cancelAnimationFrame(raf);
    p1 = new Bey("#2b7bff", center.x - RING_RADIUS*0.6, center.y + (Math.random()-0.5)*40);
    p2 = new Bey("#ff3b3b", center.x + RING_RADIUS*0.6, center.y + (Math.random()-0.5)*40);
    setLaunchEnabled(true);
    drawOnce();
  }

  function setLaunchEnabled(enabled){
    p1LaunchBtn.disabled = !enabled;
    p2LaunchBtn.disabled = !enabled && !botToggle.checked;
    p1Power.disabled = !enabled;
    p2Power.disabled = !enabled && !botToggle.checked;
  }

  function handleCollision(a, b){
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const d = Math.hypot(dx, dy);
    const minDist = BEY_RADIUS*2.1; // slightly larger than touching for reliable hits
    if (d === 0 || d > minDist) return;

    // Push apart
    const overlap = (minDist - d) / 2;
    const nx = dx / d, ny = dy / d;
    a.x -= nx * overlap;
    a.y -= ny * overlap;
    b.x += nx * overlap;
    b.y += ny * overlap;

    // Velocity exchange along collision normal
    const avn = a.vx*nx + a.vy*ny;
    const bvn = b.vx*nx + b.vy*ny;
    const diff = bvn - avn;
    a.vx += diff*nx; a.vy += diff*ny;
    b.vx -= diff*nx; b.vy -= diff*ny;

    // Damping & energy loss from the hit (more dramatic)
    a.vx *= COLLISION_DAMP; a.vy *= COLLISION_DAMP;
    b.vx *= COLLISION_DAMP; b.vy *= COLLISION_DAMP;
    a.energy = Math.max(0, a.energy - 0.025);
    b.energy = Math.max(0, b.energy - 0.025);

    // Sparks!
    makeSparks((a.x+b.x)/2, (a.y+b.y)/2, nx, ny);
  }

  function makeSparks(x, y, nx, ny){
    for (let i=0;i<8;i++){
      const ang = Math.atan2(ny, nx) + (Math.random()-0.5)*1.6;
      const spd = 2 + Math.random()*2.5;
      sparks.push({ x, y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd, life: 20 });
    }
  }

  function drawSparks(){
    for (let i=sparks.length-1; i>=0; i--){
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy;
      s.vx *= 0.95; s.vy *= 0.95;
      s.life--;
      ctx.globalAlpha = Math.max(0, s.life/20);
      ctx.fillStyle = "#f5b300";
      ctx.beginPath();
      ctx.arc(s.x, s.y, 2, 0, Math.PI*2);
      ctx.fill();
      ctx.globalAlpha = 1;
      if (s.life <= 0) sparks.splice(i,1);
    }
  }

  function drawArena(){
    ctx.clearRect(0,0,W,H);

    // Outer ring visual
    ctx.beginPath();
    ctx.arc(center.x, center.y, RING_RADIUS+18, 0, Math.PI*2);
    ctx.strokeStyle = "#e3e6ef";
    ctx.lineWidth = 24;
    ctx.stroke();

    // Inner playable ring
    ctx.beginPath();
    ctx.arc(center.x, center.y, RING_RADIUS, 0, Math.PI*2);
    ctx.strokeStyle = "#cbd1de";
    ctx.lineWidth = 4;
    ctx.stroke();

    // Center spot
    ctx.beginPath();
    ctx.arc(center.x, center.y, 4, 0, Math.PI*2);
    ctx.fillStyle = "#9aa3b2";
    ctx.fill();
  }

  function checkRoundEnd(){
    const p1Out = !p1.alive || p1.energy <= 0.004;
    const p2Out = !p2.alive || p2.energy <= 0.004;

    if (p1Out && p2Out) {
      announce("Draw! Both Beys stopped or went out.");
      roundOver = true; setLaunchEnabled(false);
      return "draw";
    }
    if (p1Out) {
      scores.p2++; updateScore();
      announce("P2 wins the round!");
      roundOver = true; setLaunchEnabled(false);
      return "p2";
    }
    if (p2Out) {
      scores.p1++; updateScore();
      announce("P1 wins the round!");
      roundOver = true; setLaunchEnabled(false);
      return "p1";
    }
    return null;
  }

  function updateScore(){
    p1ScoreEl.textContent = scores.p1;
    p2ScoreEl.textContent = scores.p2;
    if (scores.p1 >= targetWins || scores.p2 >= targetWins){
      const winner = scores.p1 > scores.p2 ? "P1" : "P2";
      setTimeout(()=> alert(`${winner} wins the match!`), 60);
    }
  }

  function announce(msg){ console.info(msg); }

  function loop(){
    drawArena();

    p1.update();
    p2.update();

    handleCollision(p1, p2);

    p1.draw();
    p2.draw();

    drawSparks();

    if (!roundOver){
      const end = checkRoundEnd();
      if (end){ cancelAnimationFrame(raf); return; }
    }

    raf = requestAnimationFrame(loop);
  }

  function drawOnce(){ drawArena(); p1.draw(); p2.draw(); }

  // Bot logic for P2
  function maybeBotLaunch(){
    if (!botToggle.checked) return;
    setTimeout(()=>{
      const botPower = 55 + Math.round(Math.random()*40); // 55–95
      p2Power.value = botPower;
      p2PowerLbl.textContent = botPower;
      launchP2();
    }, 450 + Math.random()*600);
  }

  function launchP1(){
    if (p1.energy > 0.01) return;
    p1.launch(+p1Power.value);
    p1LaunchBtn.disabled = true; p1Power.disabled = true;
    if (p2.energy > 0.01) startRound(); else maybeBotLaunch();
  }

  function launchP2(){
    if (p2.energy > 0.01) return;
    p2.launch(+p2Power.value);
    p2LaunchBtn.disabled = true; p2Power.disabled = true;
    if (p1.energy > 0.01) startRound();
  }

  function startRound(){
    cancelAnimationFrame(raf);
    roundOver = false;
    raf = requestAnimationFrame(loop);
  }

  // UI events
  p1Power.addEventListener('input', ()=> p1PowerLbl.textContent = p1Power.value);
  p2Power.addEventListener('input', ()=> p2PowerLbl.textContent = p2Power.value);
  p1LaunchBtn.addEventListener('click', launchP1);
  p2LaunchBtn.addEventListener('click', launchP2);

  rematchBtn.addEventListener('click', ()=> { resetRound(); });
  resetAllBtn.addEventListener('click', ()=> {
    scores = { p1: 0, p2: 0 }; updateScore(); resetRound();
  });
  bestOfBtn.addEventListener('click', ()=> {
    targetWins = 3; targetWinsEl.textContent = targetWins;
    scores = { p1: 0, p2: 0 }; updateScore(); resetRound();
  });
  botToggle.addEventListener('change', ()=>{
    p2LaunchBtn.disabled = botToggle.checked;
    p2Power.disabled = botToggle.checked;
  });

  // Initial draw
  drawOnce();
})();
</script>
</body>
</html>
