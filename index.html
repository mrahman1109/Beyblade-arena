<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beyblade Battle Arena</title>
<style>
  :root { --maxw: 720px; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:#f6f7fb;
         display:grid; place-items:center; min-height:100vh; }
  .wrap { width:min(var(--maxw), 95vw); }
  h1 { font-size:clamp(18px, 3.5vw, 24px); margin:12px 0; text-align:center; }
  .hud { display:grid; gap:10px; grid-template-columns: 1fr auto 1fr; align-items:center; }
  .score { display:flex; gap:12px; justify-content:center; align-items:center; }
  .score .pill { padding:6px 10px; border-radius:999px; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .controls { display:grid; gap:8px; grid-template-columns: 1fr; }
  .row { display:flex; gap:8px; align-items:center; justify-content:space-between; background:#fff; padding:8px; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  label { font-size:14px; opacity:.9; }
  input[type="range"] { width:140px; }
  button { padding:8px 12px; border:1px solid #cfd3da; background:#fff; border-radius:10px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .muted { opacity:.7; font-size:13px; }
  canvas { width:100%; height:auto; display:block; background:radial-gradient(circle at 50% 50%, #fff 0 55%, #f1f2f6 56% 100%); border-radius:16px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .footer { margin:10px 0 2px; text-align:center; font-size:12px; opacity:.65; }
  @media (min-width:680px){
    .controls { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <h1>🏟️ Beyblade Battle Arena</h1>

    <div class="hud">
      <div class="score">
        <span class="pill">🔵 P1: <b id="p1Score">0</b></span>
        <span class="pill">🔴 P2: <b id="p2Score">0</b></span>
        <span class="pill">🎯 First to <b id="targetWins">3</b></span>
      </div>
      <div><button id="resetAll">Reset</button></div>
      <div style="text-align:right">
        <label><input type="checkbox" id="botToggle" /> Bot controls P2</label>
      </div>
    </div>

    <canvas id="arena" width="720" height="720" aria-label="Beyblade Arena"></canvas>

    <div class="controls">
      <div class="row">
        <div><strong>🔵 Player 1</strong> <span class="muted">(Left)</span></div>
        <div>
          <label>Power <span id="p1PowerLbl">60</span></label>
          <input type="range" id="p1Power" min="20" max="100" value="60" />
          <button id="p1Launch">Launch P1</button>
        </div>
      </div>

      <div class="row">
        <div><strong>🔴 Player 2</strong> <span class="muted">(Right)</span></div>
        <div>
          <label>Power <span id="p2PowerLbl">60</span></label>
          <input type="range" id="p2Power" min="20" max="100" value="60" />
          <button id="p2Launch">Launch P2</button>
        </div>
      </div>

      <div class="row">
        <div><strong>Match Controls</strong></div>
        <div>
          <button id="rematch">Rematch</button>
          <button id="bestOf">Best of 5</button>
        </div>
      </div>
    </div>

    <div class="footer">Tip: Pick your power, then press Launch. Bumps drain energy. Ring-out or stop = you lose the round.</div>
  </div>

<script>
(() => {
  const canvas = document.getElementById('arena');
  const ctx = canvas.getContext('2d');

  // UI elements
  const p1Power = document.getElementById('p1Power');
  const p2Power = document.getElementById('p2Power');
  const p1PowerLbl = document.getElementById('p1PowerLbl');
  const p2PowerLbl = document.getElementById('p2PowerLbl');
  const p1LaunchBtn = document.getElementById('p1Launch');
  const p2LaunchBtn = document.getElementById('p2Launch');
  const rematchBtn = document.getElementById('rematch');
  const resetAllBtn = document.getElementById('resetAll');
  const bestOfBtn = document.getElementById('bestOf');
  const botToggle = document.getElementById('botToggle');
  const p1ScoreEl = document.getElementById('p1Score');
  const p2ScoreEl = document.getElementById('p2Score');
  const targetWinsEl = document.getElementById('targetWins');

  // Arena setup
  const W = canvas.width, H = canvas.height;
  const center = { x: W/2, y: H/2 };
  const RING_RADIUS = Math.min(W,H)*0.44;    // inner playable ring
  const BEY_RADIUS = Math.min(W,H)*0.03;     // size of bey
  const EDGE_OUT = RING_RADIUS + BEY_RADIUS*0.2;

  // Physics constants
  const BASE_FRICTION = 0.004;  // energy drain per frame
  const WALL_BOUNCE = 0.9;
  const COLLISION_DAMP = 0.96;

  let raf = null;
  let roundOver = false;
  let targetWins = 3;
  let scores = { p1: 0, p2: 0 };

  class Bey {
    constructor(color, startX, startY, aimTowardsCenter = true){
      this.color = color;
      this.x = startX;
      this.y = startY;
      this.vx = 0;
      this.vy = 0;
      this.energy = 0;
      this.alive = true;
      this.aimToCenter = aimTowardsCenter;
    }
    launch(power){
      // Convert 20–100 power into velocity & energy
      const p = Math.max(20, Math.min(100, power));
      this.energy = p / 100; // 0.2–1.0
      const speed = 3 * this.energy; // velocity magnitude

      // Direction: mostly towards center with slight randomness
      let angle = Math.atan2(center.y - this.y, center.x - this.x);
      angle += (Math.random() - 0.5) * 0.6; // ± ~34°
      this.vx = Math.cos(angle) * speed;
      this.vy = Math.sin(angle) * speed;
    }
    update(){
      if (!this.alive) return;

      // Move
      this.x += this.vx;
      this.y += this.vy;

      // Friction drains speed & energy
      const speed = Math.hypot(this.vx, this.vy);
      const drain = BASE_FRICTION + speed*0.002;
      this.energy = Math.max(0, this.energy - drain);
      if (speed > 0){
        const slow = Math.max(0, speed - drain*2);
        const k = slow / speed;
        this.vx *= k; this.vy *= k;
      }

      // Out of ring?
      const d = dist(this.x, this.y, center.x, center.y);
      if (d > EDGE_OUT) {
        this.alive = false;
      }
    }
    draw(){
      ctx.beginPath();
      ctx.arc(this.x, this.y, BEY_RADIUS, 0, Math.PI*2);
      ctx.fillStyle = this.color;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(0,0,0,.15)";
      ctx.stroke();

      // Energy ring
      ctx.beginPath();
      ctx.arc(this.x, this.y, BEY_RADIUS+4, 0, Math.PI*2*this.energy);
      ctx.strokeStyle = this.color;
      ctx.lineWidth = 3;
      ctx.stroke();
    }
  }

  // Players
  let p1 = new Bey("#2b7bff", center.x - RING_RADIUS*0.7, center.y);
  let p2 = new Bey("#ff3b3b", center.x + RING_RADIUS*0.7, center.y);

  // Helpers
  function dist(x1,y1,x2,y2){ return Math.hypot(x2-x1, y2-y1); }

  function resetRound(){
    roundOver = false;
    cancelAnimationFrame(raf);
    // Fresh beys
    p1 = new Bey("#2b7bff", center.x - RING_RADIUS*0.7, center.y);
    p2 = new Bey("#ff3b3b", center.x + RING_RADIUS*0.7, center.y);
    // Enable launching
    setLaunchEnabled(true);
    drawOnce();
  }

  function setLaunchEnabled(enabled){
    p1LaunchBtn.disabled = !enabled;
    p2LaunchBtn.disabled = !enabled && !botToggle.checked;
    p1Power.disabled = !enabled;
    p2Power.disabled = !enabled && !botToggle.checked;
  }

  function handleCollision(a, b){
    // Simple elastic-ish collision with damping
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const d = Math.hypot(dx, dy);
    if (d === 0) return;

    // Only collide if overlapping
    const minDist = BEY_RADIUS*2;
    if (d < minDist){
      // Push apart
      const overlap = (minDist - d) / 2;
      const nx = dx / d, ny = dy / d;
      a.x -= nx * overlap;
      a.y -= ny * overlap;
      b.x += nx * overlap;
      b.y += ny * overlap;

      // Swap velocity components along the normal
      const avn = a.vx*nx + a.vy*ny;
      const bvn = b.vx*nx + b.vy*ny;
      const diff = bvn - avn;
      a.vx += diff*nx; a.vy += diff*ny;
      b.vx -= diff*nx; b.vy -= diff*ny;

      // Damping & energy loss from the hit
      a.vx *= COLLISION_DAMP; a.vy *= COLLISION_DAMP;
      b.vx *= COLLISION_DAMP; b.vy *= COLLISION_DAMP;
      a.energy = Math.max(0, a.energy - 0.015);
      b.energy = Math.max(0, b.energy - 0.015);
    }
  }

  function drawArena(){
    ctx.clearRect(0,0,W,H);

    // Outer ring visual
    ctx.beginPath();
    ctx.arc(center.x, center.y, RING_RADIUS+18, 0, Math.PI*2);
    ctx.strokeStyle = "#e3e6ef";
    ctx.lineWidth = 24;
    ctx.stroke();

    // Inner playable ring
    ctx.beginPath();
    ctx.arc(center.x, center.y, RING_RADIUS, 0, Math.PI*2);
    ctx.strokeStyle = "#cbd1de";
    ctx.lineWidth = 4;
    ctx.stroke();

    // Center spot
    ctx.beginPath();
    ctx.arc(center.x, center.y, 4, 0, Math.PI*2);
    ctx.fillStyle = "#9aa3b2";
    ctx.fill();
  }

  function checkRoundEnd(){
    // A bey is "out" if: not alive OR energy basically at zero
    const p1Out = !p1.alive || p1.energy <= 0.005;
    const p2Out = !p2.alive || p2.energy <= 0.005;

    if (p1Out && p2Out) {
      announce("Draw! Both Beys stopped or went out.");
      roundOver = true;
      setLaunchEnabled(false);
      return "draw";
    }
    if (p1Out) {
      scores.p2++;
      updateScore();
      announce("P2 wins the round!");
      roundOver = true;
      setLaunchEnabled(false);
      return "p2";
    }
    if (p2Out) {
      scores.p1++;
      updateScore();
      announce("P1 wins the round!");
      roundOver = true;
      setLaunchEnabled(false);
      return "p1";
    }
    return null;
  }

  function updateScore(){
    p1ScoreEl.textContent = scores.p1;
    p2ScoreEl.textContent = scores.p2;
    // Match winner?
    if (scores.p1 >= targetWins || scores.p2 >= targetWins){
      const winner = scores.p1 > scores.p2 ? "P1" : "P2";
      setTimeout(()=> alert(`${winner} wins the match!`), 50);
    }
  }

  function announce(msg){
    // Lightweight inline toast
    console.info(msg);
  }

  function loop(){
    drawArena();

    // Updates
    p1.update();
    p2.update();

    // Collisions
    handleCollision(p1, p2);

    // Draw
    p1.draw();
    p2.draw();

    if (!roundOver){
      const end = checkRoundEnd();
      if (end){
        // stop here; wait for Rematch
        cancelAnimationFrame(raf);
        return;
      }
    }

    raf = requestAnimationFrame(loop);
  }

  function drawOnce(){
    drawArena(); p1.draw(); p2.draw();
  }

  // Bot logic for P2: auto-pick a power and launch a moment after P1
  function maybeBotLaunch(){
    if (!botToggle.checked) return;
    // Slight delay for drama
    setTimeout(()=>{
      const botPower = 50 + Math.round(Math.random()*40); // 50–90
      p2Power.value = botPower;
      p2PowerLbl.textContent = botPower;
      launchP2();
    }, 500 + Math.random()*600);
  }

  // Launch handlers
  function launchP1(){
    if (p1.energy > 0.01) return; // already launched
    p1.launch(+p1Power.value);
    p1LaunchBtn.disabled = true;
    p1Power.disabled = true;
    // If both launched, start loop
    if (p2.energy > 0.01) startRound();
    else maybeBotLaunch();
  }

  function launchP2(){
    if (p2.energy > 0.01) return;
    p2.launch(+p2Power.value);
    p2LaunchBtn.disabled = true;
    p2Power.disabled = true;
    if (p1.energy > 0.01) startRound();
  }

  function startRound(){
    cancelAnimationFrame(raf);
    roundOver = false;
    raf = requestAnimationFrame(loop);
  }

  // UI events
  p1Power.addEventListener('input', ()=> p1PowerLbl.textContent = p1Power.value);
  p2Power.addEventListener('input', ()=> p2PowerLbl.textContent = p2Power.value);
  p1LaunchBtn.addEventListener('click', launchP1);
  p2LaunchBtn.addEventListener('click', launchP2);

  rematchBtn.addEventListener('click', ()=> {
    resetRound();
    // preserve scores
  });

  resetAllBtn.addEventListener('click', ()=> {
    scores = { p1: 0, p2: 0 };
    updateScore();
    resetRound();
  });

  bestOfBtn.addEventListener('click', ()=> {
    targetWins = 3; // best of 5 = first to 3
    targetWinsEl.textContent = targetWins;
    scores = { p1: 0, p2: 0 };
    updateScore();
    resetRound();
  });

  botToggle.addEventListener('change', ()=>{
    p2LaunchBtn.disabled = botToggle.checked;
    p2Power.disabled = botToggle.checked;
  });

  // Initial draw
  drawOnce();
})();
</script>
</body>
</html>
